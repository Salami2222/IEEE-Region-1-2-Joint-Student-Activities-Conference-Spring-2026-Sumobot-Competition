<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc"><title id="title">Sumobot | Autonomous control architecture</title><desc id="desc">Four primary firmware states, three attack substates, boundary detection during active motion and deterministic IR confidence handling.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker></defs><rect width="800" height="660" rx="18" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">SUMOBOT  /  AUTONOMOUS CONTROL ARCHITECTURE</text><rect x="235" y="54" width="330" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="400" y="80" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">IDLE / initialization</text><text x="400" y="103" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">5-second countdown + opening scan</text><path d="M400 118 V142" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="235" y="144" width="330" height="65" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="400" y="170" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">CROSS_RING</text><text x="400" y="193" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Forward drive to establish contact</text><path d="M315 209 V236 H190 V258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M485 209 V236 H610 V258" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="260" width="300" height="99" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="190" y="286" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">SEARCH</text><text x="190" y="309" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Varied turning durations</text><text x="190" y="328" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Reflectance-guided arena coverage</text><rect x="460" y="260" width="300" height="99" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="610" y="286" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">ATTACK</text><text x="610" y="309" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Confidence-based IR tracking</text><text x="610" y="328" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Proportional differential steering</text><path d="M340 283 H460" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M460 335 H340" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><text x="400" y="274" font-size="12" font-weight="400" text-anchor="middle" fill="#334155">Target</text><text x="400" y="356" font-size="12" font-weight="400" text-anchor="middle" fill="#334155">Timeout</text><path d="M610 359 V385" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="437" y="388" width="106" height="69" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="490" y="414" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Lock</text><text x="490" y="437" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Steer</text><rect x="557" y="388" width="106" height="69" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="610" y="414" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Coast</text><text x="610" y="437" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Brief dropout</text><rect x="677" y="388" width="108" height="69" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="731" y="414" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Reacquire</text><text x="731" y="437" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Sweep</text><path d="M543 423 H557" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M663 423 H677" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M731 388 V375 H490 V388" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="56" y="500" width="688" height="75" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="400" y="526" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Boundary detection and evasion (active driving states)</text><text x="400" y="549" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Five reflectance sensors → reverse and turn away from detected boundary</text><path d="M190 359 V498" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M610 457 V498" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="400" y="604" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Four primary states; Lock, Coast and Reacquire are ATTACK substates.</text><text x="400" y="625" font-size="13" font-weight="400" text-anchor="middle" fill="#334155">Boundary handling is a shared behavior, not a separate enumerated state.</text></g></svg>